<head>

<title>CCSU NEP 2025-26 – Complete Student Guide (University Gyaan) – विज़ुअल स्क्रिप्ट</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050816;color:#eef2ff;font-family:'Noto Sans Devanagari','Segoe UI',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
.app{max-width:1400px;margin:0 auto;padding:10px}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.top select,.top button{background:#1b2260;color:#fff;border:1px solid #3a4590;border-radius:10px;padding:8px 12px;font:inherit;font-size:.95rem;cursor:pointer}
.top button:hover{background:#2a3590}.top .grow{flex:1}
#scaler{position:relative;margin:0 auto;overflow:hidden;border-radius:16px;box-shadow:0 10px 40px #000a}
#frame{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#0a0f2c;cursor:pointer;--ac:#5b8def;font-size:22px}
.bg{position:absolute;inset:0;background:radial-gradient(1100px 600px at 15% 0,#233494aa,transparent),radial-gradient(900px 500px at 100% 100%,#1d4ed877,transparent),#0a0f2c}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.33;animation:drift 14s ease-in-out infinite alternate}
.b1{width:440px;height:440px;background:var(--ac);left:-90px;top:-80px;transition:background 1s}
.b2{width:380px;height:380px;background:#5b8def;right:-70px;bottom:-70px;animation-delay:-6s}
@keyframes drift{to{transform:translate(130px,70px) scale(1.25)}}
.gridbg{position:absolute;inset:0;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:44px 44px}
.hdr{position:absolute;left:40px;right:40px;top:20px;height:78px;display:flex;align-items:center;gap:18px}
.hdr.in{animation:hin .7s cubic-bezier(.2,.9,.3,1)}
@keyframes hin{from{opacity:0;transform:translateX(-60px)}}
.chb{width:64px;height:64px;border-radius:20px;background:var(--ac);color:#06122e;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 28px var(--ac);flex:none}
.hdr .sb{font-size:16px;opacity:.75;letter-spacing:.3px}.hdr .ti{font-size:33px;font-weight:800;line-height:1.15}
.body{position:absolute;left:40px;right:40px;top:108px;bottom:58px}
.body.enter{animation:ben .6s ease-out}
@keyframes ben{from{opacity:0;transform:translateY(30px)}}
.strip{position:absolute;left:0;right:0;bottom:0;height:7px;display:flex;gap:3px;padding:0 3px}
.strip i{flex:1;background:#ffffff1c;border-radius:4px;overflow:hidden}.strip i b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),#fff);transition:width .5s}
.teaser{position:absolute;left:40px;bottom:16px;background:#f2c261;color:#2a1f00;font-weight:800;font-size:19px;padding:5px 18px;border-radius:30px;box-shadow:0 0 20px #f2c26199}
.hint{position:absolute;right:26px;bottom:16px;font-size:15px;opacity:.55;animation:blink 2.4s infinite}
@keyframes blink{50%{opacity:.1}}
#cv{position:absolute;left:0;top:0;pointer-events:none;z-index:50}
/* reveal */
.r{opacity:0;transform:translateY(22px) scale(.96);transition:opacity .6s var(--d,0s),transform .6s var(--d,0s);pointer-events:none}
.r.on{opacity:1;transform:none;pointer-events:auto}
.r.sx{opacity:1;transform:scaleX(0);transform-origin:left;transition:transform 1.3s}.r.sx.on{transform:scaleX(1)}
.fill{width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1) var(--d,0s);display:flex;align-items:center;justify-content:center;font-weight:800;white-space:nowrap;overflow:hidden;font-size:20px;height:100%}
.r.on .fill{width:var(--w)}
.arc{fill:none;stroke-dasharray:0 2000;transition:stroke-dasharray 1.3s ease var(--d,0s)}
.r.on .arc{stroke-dasharray:var(--d2) 2000}
/* generic */
.panel{background:#ffffff12;backdrop-filter:blur(4px);border:1.5px solid #ffffff26;border-radius:22px;padding:16px 22px}
.t1{font-size:34px;font-weight:800}.t2{font-size:26px;font-weight:600}.t3{font-size:20px;opacity:.85}
.good{color:#34c38f}.bad{color:#e5656f}.gold{color:#f2c261}.blue{color:#6cb6ff}.pink{color:#ff8ad8}
.pill{display:inline-block;padding:4px 16px;border-radius:30px;font-weight:700}
.abs{position:absolute}.center{text-align:center}
.seg-i{background:#5b8def;color:#00203d}.seg-e{background:#3fb8af;color:#3a1d00}.seg-x{background:#e5656f;color:#fff}.seg-g{background:#34c38f;color:#06301a}
.stack2{display:flex;height:58px;border-radius:14px;background:#0c1130;border:1.5px solid #3a4590;position:relative}
.stack2>.fill,.stack2>.seg-i,.stack2>.seg-e,.stack2>.seg-g,.stack2>.seg-x{border-radius:12px}
.stack2.sm{height:40px}
.warn{display:inline-block;background:#e5656f2e;border:2px solid #e5656f;padding:10px 28px;border-radius:40px;font-size:26px;font-weight:700}
.glow{text-shadow:0 0 30px #e5656f,0 0 60px #e5656f88}
.title-badge{display:inline-block;font-size:28px;font-weight:800;background:linear-gradient(90deg,#f2c261,#3fb8af);color:#201400;padding:12px 30px;border-radius:50px}
.hcard{width:360px;height:330px;text-align:center;padding:22px 16px;border-radius:26px;background:#ffffff14;border:2px solid #ffffff30}
.hcard .hc-t{font-size:26px}.hcard .hc-n{font-size:96px;font-weight:800;color:#f2c261;line-height:1.15}.hcard .hc-v{font-size:32px;font-weight:800;margin-top:12px}
.stamp{display:inline-block;font-size:42px;font-weight:800;color:#e5656f;border:5px solid #e5656f;border-radius:14px;padding:2px 24px;transform:rotate(-8deg)}
.chk{font-size:22px;padding:6px 0}
.verd{font-size:34px;font-weight:800;margin-top:6px}
.sc{background:#ffffff12;border:2.5px solid #ffffff30;border-radius:22px;padding:14px 22px}
.sc.ok{border-color:#34c38f;box-shadow:0 0 24px #34c38f44}.sc.no{border-color:#e5656f;box-shadow:0 0 24px #e5656f44}
.sc-h{font-size:24px;font-weight:800;margin-bottom:8px}
.gate{display:flex;gap:14px;align-items:center;background:#ffffff12;border:2.5px dashed #f2c261;border-radius:18px;padding:12px 18px;font-size:23px}
.gate .n{background:#f2c261;color:#222;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.gate .lk{margin-left:auto;font-size:34px}
.thr{position:absolute;top:-8px;bottom:-8px;width:0;border-left:4px dashed #fff;z-index:3}
.thr span{position:absolute;top:-30px;left:-30px;width:60px;text-align:center;font-weight:800;font-size:18px;color:#fff}
input[type=range]{width:100%;accent-color:#f2c261;height:30px;cursor:pointer}
.mrow{display:flex;align-items:center;gap:14px;font-size:24px;margin-top:16px}
.mrow b{font-size:38px;color:#f2c261;min-width:60px}
/* ruler / grading */
.zone{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#06122e;transform-origin:left;height:100%}
.r.zr{opacity:1;transform:scaleX(0);transition:transform .8s var(--d,0s)}.r.zr.on{transform:scaleX(1)}
.tb{border-collapse:collapse;width:100%;font-size:20px}.tb th,.tb td{padding:4px 10px;text-align:center;border-bottom:1px solid #ffffff22;height:38px}.tb th{background:#ffffff1c}
.tb tr{transition:.3s}.tb tr.hl td{background:#34c38f55;font-weight:800}
.gcirc{width:150px;height:150px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:800;color:#06122e;transition:background .3s,transform .3s}
.ptr{position:absolute;top:-4px;width:90px;text-align:center;font-weight:800;color:#fff;transition:left .9s cubic-bezier(.3,1.2,.4,1);z-index:4}
.ptr .pb{background:#fff;color:#111;border-radius:10px;padding:2px 8px;display:inline-block;font-size:22px}
/* quiz */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;position:absolute;left:0;right:0;top:34px}
.qscore{position:absolute;right:0;top:-6px;font-size:24px;font-weight:800;color:#f2c261}
.qcard{background:#ffffff12;border:2.5px solid #ffffff30;border-radius:20px;padding:12px 18px;height:244px;position:relative}
.qcard.right{border-color:#34c38f;box-shadow:0 0 22px #34c38f55}.qcard.wrong{border-color:#e5656f;box-shadow:0 0 22px #e5656f55}
.qh{font-size:24px;display:flex;align-items:center;gap:10px}.qav{font-size:34px}
.qq{font-size:22px;margin:6px 0 8px;min-height:56px}.qq b{color:#f2c261}
.qb{display:flex;gap:12px}.qb button{flex:1;background:#2a3590;color:#fff;border:2px solid #4a58c0;border-radius:12px;padding:8px;font:inherit;font-size:21px;cursor:pointer}
.qb button.sel{background:#f2c261;color:#222;border-color:#fff}
.qres{position:absolute;left:18px;right:18px;bottom:8px}.qv{font-size:24px;font-weight:800}.qw{font-size:19px;opacity:.9}
/* grace */
.jar{position:absolute;left:10px;top:70px;width:230px;height:340px;border:5px solid #7fe3ff;border-top:none;border-radius:0 0 60px 60px;background:#7fe3ff14}
.coin{position:absolute;width:46px;height:46px;border-radius:50%;background:radial-gradient(#fff3a0,#ffc400);color:#5a3b00;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px #f2c261;transition:transform 1.4s cubic-bezier(.3,.8,.3,1) var(--cd,0s),opacity .6s;z-index:5}
.coin.fly{transform:translate(var(--tx),var(--ty))}
.gpaper{position:absolute;top:170px;width:190px;text-align:center;padding:12px 8px;background:#ffffff14;border:3px solid #e5656f;border-radius:18px}
.gpaper.g{border-color:#34c38f;box-shadow:0 0 20px #34c38f66}
.gpaper small{font-size:18px;opacity:.8}.gpaper .mk{font-size:56px;font-weight:800;height:70px}
.gpaper .nw,.gpaper.g .od{display:none}.gpaper.g .nw{display:inline}.gpaper .stt{font-size:22px;font-weight:700}
.gchip{position:absolute;top:-16px;right:-8px;background:#f2c261;color:#222;border-radius:20px;padding:0 12px;font-size:22px;font-weight:800;display:none}.gpaper.g .gchip{display:block}
/* promotion */
.rahul{position:absolute;top:60px;width:90px;height:90px;border-radius:50%;background:#ffffff22;border:3px solid var(--ac);font-size:56px;display:flex;align-items:center;justify-content:center;transition:left 3s cubic-bezier(.5,0,.3,1);z-index:6}
.sign{position:absolute;top:178px;width:200px;text-align:center;background:#ffffff18;border:2.5px solid var(--ac);border-radius:16px;padding:8px;font-size:22px;font-weight:800}
/* lanes */
.node{position:absolute;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;border:4px solid}
.lane{position:absolute;left:0;right:0;height:170px;border-radius:24px}
.rundot{position:absolute;width:22px;height:22px;border-radius:50%;background:#f2c261;box-shadow:0 0 14px #f2c261;animation:run 3.2s linear infinite}
@keyframes run{from{left:330px}to{left:1030px}}
.arrw{position:absolute;height:8px;border-radius:4px}
/* tanks */
.tank{position:absolute;height:50px;background:repeating-linear-gradient(90deg,#ffffff30 0 20px,transparent 20px 22px)}
.zok{position:absolute;top:0;height:100%;background:#34c38f33;border-left:3px solid #34c38f}
.znot{position:absolute;top:0;height:100%;background:repeating-linear-gradient(45deg,#e5656f44 0 8px,#e5656f22 8px 16px)}
.limit{position:absolute;top:-34px;bottom:-8px;width:0;border-left:4px solid #f2c261}
.limit span{position:absolute;top:0;left:8px;white-space:nowrap;font-weight:800;color:#f2c261;font-size:20px}
.failfill{position:absolute;top:8px;height:34px;border-radius:8px;background:#e5656f;box-shadow:0 0 14px #e5656f;width:0;transition:width 1.4s ease}
/* clash */
.cal{width:170px;border-radius:16px;overflow:hidden;background:#fff;color:#222;text-align:center;font-weight:800;box-shadow:0 8px 24px #0008}
.cal i{display:block;background:#e5656f;color:#fff;font-style:normal;padding:4px;font-size:20px}.cal b{display:block;font-size:40px;padding:10px 4px}
.clashpair{display:flex;justify-content:center;align-items:center}
.clashpair.on .cal:first-child{animation:ca 1.1s forwards}.clashpair.on .cal:last-child{animation:cb 1.1s forwards}
@keyframes ca{from{transform:translateX(-170px)}to{transform:translateX(-14px) rotate(-6deg)}}
@keyframes cb{from{transform:translateX(170px)}to{transform:translateX(14px) rotate(6deg)}}
/* timeline */
.tl{position:relative;height:60px;border-radius:30px;background:#0c1130;overflow:hidden;border:1.5px solid #3a4590;display:flex}
.tick{position:absolute;font-size:20px;font-weight:700;transform:translateX(-50%)}
/* sgpa */
.srow{display:grid;grid-template-columns:1.7fr .8fr .7fr .8fr 1.5fr;align-items:center;gap:8px;text-align:center;font-size:22px;padding:5px 12px;border-radius:12px;background:#ffffff12;margin-bottom:6px;height:50px}
.srow.hd{background:#ffffff26;font-weight:800;height:44px}
.pbar{height:22px;border-radius:11px;background:linear-gradient(90deg,#5b8def,#8b7cf6);text-align:right;padding-right:8px;font-size:15px;color:#06122e;font-weight:800;line-height:22px;width:0;transition:width 1.2s var(--d,0s)}
.r.on .pbar{width:var(--w)}
.formula{background:#0a1030;border:2.5px solid #5b8def;border-radius:16px;padding:10px 18px;text-align:center;font-size:28px;font-weight:800}
.big{font-size:54px;font-weight:800;color:#f2c261;text-align:center}
.cbox{border-radius:18px;padding:12px 18px;font-size:24px}
.blobcard{background:#ffffff12;border:2px solid #ffffff30;border-radius:18px;padding:14px 18px}
.chip10{background:#ffffff14;border:2px solid #ffffff30;border-radius:18px;padding:12px 10px;height:100px;font-size:21px;font-weight:700;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.4s}
.chip10 i{font-style:normal;font-size:30px}.chip10.pulse{background:var(--ac);color:#06122e;animation:pul 1.2s infinite}
@keyframes pul{50%{transform:scale(1.08)}}
.cheat{background:#ffffff14;border:2px solid #ffffff30;border-radius:18px;padding:14px 16px;font-size:22px;height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.cheat b{color:#f2c261;font-size:30px}
.sub{display:inline-block;background:#f00;color:#fff;font-weight:800;padding:14px 36px;border-radius:14px;font-size:32px}
.sub.on{animation:pul 1.2s infinite}
.bell.on{display:inline-block;animation:ring 1s infinite;font-size:60px}
@keyframes ring{25%{transform:rotate(18deg)}75%{transform:rotate(-18deg)}}
.shake.on{animation:shk .6s}@keyframes shk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pop.on{animation:pp .8s}@keyframes pp{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
/* controls & script */
.nav{display:flex;gap:10px;margin-top:10px}
.nav button{flex:1;padding:12px;border:0;border-radius:12px;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;color:#fff}
#prev{background:#3a4590}#next{background:linear-gradient(90deg,#1e90ff,#8e44ad)}
.script{margin-top:10px;background:#10163b;border-radius:14px;padding:12px 14px;border:1px solid #232c6b}
.script p{margin:0 0 8px;padding:8px 12px;border-radius:10px;font-size:1.15rem;line-height:1.75;opacity:.35;transition:.4s;border-left:4px solid transparent}
.script p.act{opacity:1;background:#1c2560;border-left-color:#f2c261}.script p.done{opacity:.6}
.hide-script .script{display:none}
.sh{font-size:15px;opacity:.7;margin:0 0 10px;letter-spacing:.3px}
#recbar{display:none}
/* ===== रिकॉर्डिंग मोड: बाएँ स्क्रिप्ट, दाएँ 16:9 फ़्रेम, चारों तरफ़ काला बॉर्डर ===== */
body.rec{background:#000;overflow:hidden}
.rec .top,.rec .nav{display:none}
.rec .app{position:fixed;inset:0;max-width:none;padding:0;display:flex;flex-direction:row;align-items:center;background:#000}
.rec #rcol{order:2;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;flex:none}
.rec #scaler{border-radius:0;box-shadow:none;margin:0}
.rec .hint{display:none}
body.rec .script{display:block;order:1;flex:none;margin:0;border:0;border-radius:0;border-right:2px solid #1b2260;background:#070a1f;overflow-y:auto;overflow-x:hidden;padding:16px 14px 40vh;scrollbar-width:none}
.rec .script::-webkit-scrollbar{display:none}
.rec .script p{font-size:var(--fs,26px);line-height:1.6;margin:0 0 16px;padding:10px 14px;opacity:.28;border-left-width:5px}
.rec .script p.act{opacity:1;background:#18205a;border-left-color:#f2c261;box-shadow:0 0 0 1px #2c3a9a}
.rec .script p.done{opacity:.18}
.rec #recbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;color:#9aa3d6;font-size:14px}
#recbar button{background:#141a47;color:#dfe5ff;border:1px solid #2c3a9a;border-radius:8px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
#recbar button:hover{background:#2a3590}
#rb-info{margin-left:6px;opacity:.85}
.vb{position:absolute;left:0;bottom:40px;width:80px;height:0;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-weight:800;color:#06122e;font-size:20px;transition:height 1.1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.r.on .vb{height:var(--h)}
.arc2{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.2s ease .2s}
.r.on .arc2{stroke-dashoffset:0}
.dotc{opacity:0;transition:opacity .4s var(--d,0s)}.r.on .dotc{opacity:1}
.tb.cmp th,.tb.cmp td{height:30px;padding:2px 8px;font-size:19px}
.stack2>div:first-child{border-radius:12px 0 0 12px}
.vb{height:0;border-radius:10px 10px 0 0;transition:height 1.2s cubic-bezier(.2,.8,.2,1) var(--d,0s);display:flex;align-items:flex-start;justify-content:center;font-weight:800;padding-top:6px;color:#06122e;font-size:22px}
.r.on .vb{height:var(--h)}
.tb.cmp th,.tb.cmp td{height:32px;padding:2px 8px}
.tt3{font-size:20px;color:#dbe4ff}#rp{position:absolute;right:36px;top:14px;width:100px;text-align:center;z-index:20}#rpe{display:flex;width:70px;height:70px;margin:0 auto;border-radius:50%;background:#ffffff22;border:3px solid var(--ac);font-size:44px;align-items:center;justify-content:center;animation:bob 2.4s ease-in-out infinite;box-shadow:0 0 20px var(--ac)}#rpm{position:absolute;right:4px;top:38px;font-style:normal;font-size:26px}#rp b{font-size:14px;opacity:.85}@keyframes bob{50%{transform:translateY(-5px)}}#brand{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-weight:800;font-size:17px;color:#f2c261;letter-spacing:.5px;opacity:.9;pointer-events:none}

.r{transform:translate(var(--tx,0),var(--ty,24px)) scale(.9);transition:opacity .55s var(--d,0s),transform .75s cubic-bezier(.2,1.25,.35,1) var(--d,0s)}
.r.on{transform:none}
.title-badge{position:relative;overflow:hidden}.title-badge::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:shine 3s infinite}@keyframes shine{to{left:140%}}
.panel.on,.sc.on,.cheat.on,.blobcard.on,.gate.on{animation:flash 1.1s ease-out}@keyframes flash{0%{box-shadow:0 0 0 0 var(--ac)}40%{box-shadow:0 0 34px 6px var(--ac)}100%{box-shadow:0 0 0 0 transparent}}
.panel.pop.on{animation:pp .8s}
#wipe{position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(90deg,transparent,var(--ac),transparent);opacity:0;z-index:40;pointer-events:none;transform:skewX(-18deg)}#wipe.go{animation:wipe .9s ease-out}@keyframes wipe{0%{left:-40%;opacity:.55}100%{left:110%;opacity:0}}
.pt{position:absolute;bottom:-20px;border-radius:50%;background:#fff;opacity:0;animation:fl linear infinite}@keyframes fl{10%{opacity:.35}100%{transform:translateY(-780px);opacity:0}}
.gridbg{animation:gd 30s linear infinite}@keyframes gd{to{background-position:44px 44px}}
#rpe{position:relative}#rpe::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ac);animation:ring2 1.6s infinite}@keyframes ring2{from{transform:scale(1);opacity:.8}to{transform:scale(1.5);opacity:0}}
.hdr .ti{background:linear-gradient(90deg,#fff 60%,var(--ac));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.r{filter:blur(7px);transition:opacity .55s var(--d,0s),transform .75s cubic-bezier(.2,1.25,.35,1) var(--d,0s),filter .5s var(--d,0s)}
.r.on{filter:none}.r.sx,.r.zr{filter:none}
.r.on .stamp,.r.on.stamp{animation:slam .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes slam{0%{transform:scale(3.2) rotate(-20deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
.big{animation:glowp 3s ease-in-out infinite}@keyframes glowp{50%{text-shadow:0 0 22px #f2c26199}}
.warn{animation:warnp 1.8s ease-in-out infinite}@keyframes warnp{50%{box-shadow:0 0 24px #e5656f88}}
.chb{animation:chp 3s ease-in-out infinite}@keyframes chp{50%{box-shadow:0 0 46px var(--ac);transform:scale(1.07)}}
.mrow input[type=range]{flex:1}
select{font:inherit}

html,body{background:#070b14}
#frame{background:#0b1220;--ac:#5b8def;font-family:'Noto Sans Devanagari','Inter','Segoe UI',system-ui,sans-serif}
.bg{background:radial-gradient(1000px 560px at 8% 0,#1b2a4d99,transparent),#0b1220}
.blob{opacity:.1;animation:none}.pt,.bg::after{display:none}.gridbg{opacity:.45}
.hdr.in{animation:hin2 .5s ease-out}@keyframes hin2{from{opacity:0;transform:translateY(-8px)}}
.chb{width:52px;height:52px;border-radius:10px;background:#ffffff0d;border:1px solid #ffffff26;color:var(--ac);box-shadow:none;animation:none;font-size:24px}
.hdr .sb{font-size:13px;letter-spacing:1.6px;text-transform:uppercase;opacity:.6}
.hdr .ti{font-size:32px;font-weight:600;letter-spacing:-.2px;background:none;-webkit-text-fill-color:#f1f5ff;color:#f1f5ff}
.r{transform:translateY(14px);transition:opacity .5s var(--d,0s) ease,transform .6s var(--d,0s) cubic-bezier(.22,.61,.36,1)}
.r.on{transform:none}
.pop.on,.r.on .stamp,.r.on.stamp{animation:none}
.panel,.sc,.blobcard,.cheat,.gate,.srow,.cal,.formula{border-radius:10px;box-shadow:none;backdrop-filter:none}
.panel{background:#ffffff08;border:1px solid #ffffff1f}
.sc{background:#ffffff08;border:1px solid #ffffff1f}.sc.ok{border-color:#34c38f88;background:#34c38f12}.sc.no{border-color:#e5656f88;background:#e5656f12}
.pill{border-radius:6px;font-weight:600;box-shadow:none}
.title-badge{background:none!important;color:#f1f5ff!important;border:0;border-left:3px solid var(--ac);border-radius:0;padding:6px 18px;font-weight:600;box-shadow:none}.title-badge::after{display:none}
.warn{background:#e5656f14;border:1px solid #e5656f55;border-left:3px solid #e5656f;border-radius:6px;animation:none;color:#ffc2c7;font-weight:500;box-shadow:none}
.stamp{border:2px solid #e5656f;color:#e5656f;transform:none!important;border-radius:6px;font-weight:700;letter-spacing:1px;background:none;text-shadow:none}
.verd{font-weight:600;border-radius:6px}.big{animation:none;font-weight:600;text-shadow:none}
.gold{color:#f2c261}.gate{animation:none!important}.gate .n{border-radius:6px}
.srow{background:#ffffff08}.srow.hd{background:#ffffff14;font-weight:600}
.formula{border:1px solid #ffffff22;background:#ffffff08;font-weight:600}
.stack2{border-radius:6px}.sc-h{font-weight:600;letter-spacing:.3px}
.ck,.cx,.cw{font-style:normal;font-weight:700}.ck{color:#34c38f}.cx{color:#e5656f}.cw{color:#f2c261}
.ic{display:inline-block;width:1em;height:1em;vertical-align:-.14em;fill:none;stroke:currentColor;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}.ic *{vector-effect:non-scaling-stroke}
#rpe{background:#ffffff0f;border:1.5px solid #ffffff3a;box-shadow:none;animation:none;color:#cfe0ff}#rpe::after{display:none}#rpm{display:none}#rp b{opacity:.7;font-weight:500;letter-spacing:1px}
.rahul{background:#ffffff10!important;border:1.5px solid #ffffff44!important;box-shadow:none!important;color:#cfe0ff}
#brand{color:#94a3b8;font-weight:500;letter-spacing:2px;text-transform:uppercase;font-size:12px}
.teaser{background:#ffffff10!important;color:#cbd5e1!important;border:1px solid #ffffff22!important;border-radius:6px!important;box-shadow:none!important;font-weight:500}
.sub{border-radius:6px}.hint{opacity:.4}
#wipe{background:#0b1220;transform:none;opacity:0}#wipe.go{animation:wfade .45s ease}@keyframes wfade{0%{opacity:1}100%{opacity:0}}
.pill.seg-i{background:#5b8def22!important;color:#b4cbff!important;border:1px solid #5b8def66!important}
.pill.seg-e{background:#3fb8af22!important;color:#9ee6df!important;border:1px solid #3fb8af66!important}
.pill.seg-g{background:#34c38f22!important;color:#9be8c6!important;border:1px solid #34c38f66!important}
.pill.seg-x{background:#e5656f22!important;color:#ffb3b9!important;border:1px solid #e5656f66!important}
.w{display:inline-block;opacity:0;transform:translateY(6px)}
.r.tx .w{display:inline;transform:none}
.w.go{opacity:1;transform:none;transition:opacity .4s calc(var(--d,0s) + .15s + var(--wi,0)*var(--st,.075s)),transform .45s calc(var(--d,0s) + .15s + var(--wi,0)*var(--st,.075s)) cubic-bezier(.22,.61,.36,1)}
.r.tx .w.go{transition:opacity .01s calc(var(--d,0s) + .12s + var(--wi,0)*var(--st,.04s))}
.hdr .w.go{transition:opacity .4s calc(.1s + var(--wi,0)*var(--st,.08s)),transform .45s calc(.1s + var(--wi,0)*var(--st,.08s)) cubic-bezier(.22,.61,.36,1)}
.body,.hdr,#teaser,#rp{transition:opacity .3s ease,transform .3s ease}
.out{opacity:0!important;transform:translateY(-10px)!important;pointer-events:none}
#wipe{display:none}
.r[data-fl],.r[data-fl] .w,.r[data-fl] .w2{transition-delay:0s!important;transition-duration:.18s!important}
.thr>span{white-space:nowrap}.thr .w{position:static!important;width:auto!important;top:auto!important;left:auto!important}
</style>

let AC=null,MG=null,NB=null,SFX_ON=true,VOL=.6,UNL=false;const LASTS={};

function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=VOL*1.6;const cp=AC.createDynamicsCompressor();MG.connect(cp);cp.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;loadSmp()}catch(e){AC=null;return null}}

function tone(t,f1,f2,dur,type,vol,att){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.05)}

function soundsFor(nu,quiet){
  const seen={};let n=0,tap=false;
  const put=(k,d,a,b)=>{const key=k+'@'+(d||0).toFixed(2)+'@'+(a||0);if(seen[key]||n>20)return;seen[key]=1;n++;sfx(k,d,a,b)};
  const dl=el=>{const t=getComputedStyle(el).transitionDelay||'0s';return Math.max(...t.split(',').map(x=>parseFloat(x)||0))};
  const pv=(el,p)=>parseFloat(el.style.getPropertyValue(p));
  nu.forEach((e,idx)=>{
    const d=dl(e),c=e.classList;let done=false;
    if(c.contains('bell')){put('bell',d);done=true}
    else if(c.contains('sub')){put('click',d);done=true}
    else if(c.contains('clashpair')){put('clash',d);done=true}
    else if(c.contains('stamp')||e.querySelector('.stamp')){put('stamp',d);done=true}
    else if(c.contains('verd')){put(c.contains('good')?'pass':'fail',d);done=true}
    else if(c.contains('chk')){put('tick',d);done=true}
    else if(c.contains('zone')){put('note',d,[...e.parentNode.children].indexOf(e));done=true}
    else if(c.contains('barcol')){put('bar',idx*.12,(+e.dataset.v||12)/23,1.1);done=true}
    else if(e.tagName==='TR'||c.contains('srow')){put('tick',d);done=true}
    else if(c.contains('node')||c.contains('chip10')||c.contains('cheat')||c.contains('gpaper')||c.contains('qcard')||c.contains('hcard')){put('pop',d,idx%6);done=true}
    else if(c.contains('pop')){put('pop',d);done=true}
    else if(e.dataset.count||e.querySelector('[data-count]'))done=true;
    if(c.contains('sx')){put('draw',d,0);done=true}
    e.querySelectorAll('.vb').forEach(v=>{put('bar',dl(v),(pv(v,'--h')/340)||.5,1.2);done=true});
    e.querySelectorAll('.fill').forEach(v=>{put('bar',dl(v),(pv(v,'--w')/100)||.5,1.1);done=true});
    e.querySelectorAll('.pbar').forEach(v=>{put('bar',dl(v),(pv(v,'--w')/100)||.5,1.2);done=true});
    e.querySelectorAll('.arc').forEach((v,k)=>{put('draw',dl(v),k);done=true});
    if(!done&&!quiet&&!tap){tap=true;put('tap',d)}
  });
}

function fit(){
  const rec=document.body.classList.contains('rec'),sc=$('scaler');
  if(rec){
    const W=innerWidth,H=innerHeight,M=10;
    let sw=Math.floor((W-M*3)*0.74/16)*16;                 // फ़्रेम की चौड़ाई (16 का गुणज)
    if(sw/16*9>H-M*2-44)sw=Math.floor((H-M*2-44)/9)*16;     // नीचे recbar के लिए जगह
    const sh=sw/16*9,s=sw/1280,lw=W-sw-M*3;
    sc.style.width=sw+'px';sc.style.height=sh+'px';frame.style.transform='scale('+s+')';
    scriptBox.style.width=lw+'px';scriptBox.style.height=H+'px';
    $('rcol').style.margin='0 '+M+'px 0 '+M+'px';
    requestAnimationFrame(()=>{const r=sc.getBoundingClientRect();$('rb-info').textContent='क्रॉप फ़्रेम: '+Math.round(r.width)+'×'+Math.round(r.height)+' px • x='+Math.round(r.left)+', y='+Math.round(r.top)});
    const a=scriptBox.querySelector('.act');if(a)a.scrollIntoView({block:'center'});
  }else{
    const w=document.querySelector('.app').clientWidth-20,s=Math.min(w/1280,1.6);

function setSnd(on){SFX_ON=on;try{localStorage.setItem('ugsfx',on?'1':'0')}catch(e){}paintSnd();if(on)sfx('pop')}
$('snd').onclick=()=>setSnd(!SFX_ON);$('rb-snd').onclick=()=>setSnd(!SFX_ON);
$('vol').value=Math.round(VOL*100);$('vol').oninput=e=>{VOL=+e.target.value/100;if(MG)MG.gain.value=VOL*1.6;try{localStorage.setItem('ugvol',VOL)}catch(x){}};$('vol').onclick=e=>e.stopPropagation();paintSnd();
$('rb-x').onclick=()=>setRec(false);$('rb-next').onclick=next;$('rb-prev').onclick=prev;$('rb-auto').onclick=()=>{auto?stopAuto():startAuto();$('rb-auto').textContent=auto?'⏸ रोको':'▶ ऑटो'};
let FS=26;try{FS=+localStorage.getItem('ugfs')||26}catch(e){}
function setFS(v){FS=Math.max(16,Math.min(48,v));document.body.style.setProperty('--fs',FS+'px');try{localStorage.setItem('ugfs',FS)}catch(e){}const a=scriptBox.querySelector('.act');if(a)a.scrollIntoView({block:'center'})}
$('rb-fm').onclick=()=>setFS(FS-2);$('rb-fp').onclick=()=>setFS(FS+2);setFS(FS);
$('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
document.addEventListener('fullscreenchange',()=>{setTimeout(fit,150);if(!document.fullscreenElement&&document.body.classList.contains('rec'))setRec(false)});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.key!=='Escape')return;if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();next()}else if(e.key==='ArrowLeft')prev();else if(e.key==='Escape'&&document.body.classList.contains('rec'))setRec(false);else if(e.key==='['||e.key===']')setFS(FS+(e.key===']'?2:-2));else if(e.key==='m'||e.key==='M')setSnd(!SFX_ON)});
pts();fit();load(0);
function load(i,step){clearTimeout(LT);if(FIRST){FIRST=0;load0(i,step);return}
 si=i;st=step||0;const els=[bodyEl,$('hdr'),$('teaser')];els.forEach(e=>e.classList.add('out'));
 LT=setTimeout(()=>{load0(i,step);els.forEach(e=>e.classList.remove('out'))},300)}
window.__S=S;window.__go=(i,s)=>{load(i,s)};
</script>
